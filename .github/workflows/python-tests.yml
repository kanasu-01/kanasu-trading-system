name: Kanasu Test Suite

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: kanasu-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Backend / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest==9.2.0 httpx==0.28.1
      - name: Run backend tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-results/backend
          python -m pytest -q --junitxml=ci-results/backend/pytest.xml 2>&1 | tee ci-results/backend/pytest.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanasu-backend-${{ github.run_id }}
          path: ci-results/backend/
          retention-days: 14

  frontend:
    name: Frontend / tests, lint, builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_KANASU_STAGING_AUTH: 'false'
      - run: npm run build
        env:
          VITE_KANASU_STAGING_AUTH: 'true'
          VITE_API_BASE_URL: https://kanasu-staging-backend.onrender.com/api

  browser:
    name: Chromium / protected staging flow
    if: >-
      github.ref == 'refs/heads/m9-v1-research-platform' ||
      (github.event_name == 'pull_request' && github.base_ref == 'm9-v1-research-platform')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KANASU_STAGING_MODE: 'true'
      ENABLE_LIVE_TRADING: 'false'
      TRADING_MODE: BACKTEST
      PAPER_DATA_SOURCE: MOCK
      KANASU_STAGING_ALLOWED_ORIGINS: http://127.0.0.1:4173
      VITE_KANASU_STAGING_AUTH: 'true'
      VITE_API_BASE_URL: http://127.0.0.1:8000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt pytest==9.2.0 httpx==0.28.1
      - run: cd frontend && npm ci && npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: cd frontend && npx playwright install --with-deps chromium
      - name: Start synthetic protected backend and Vite
        shell: bash
        run: |
          set -euo pipefail
          export KANASU_STAGING_PASSWORD_VERIFIER="$(python - <<'PY'
          from api.staging import create_password_verifier
          print(create_password_verifier('Kanasu-CI-Only-Synthetic-2026'))
          PY
          )"
          python -m uvicorn tests.staging_fixture_app:app --host 127.0.0.1 --port 8000 >backend.log 2>&1 &
          (cd frontend && npm run dev -- --host 127.0.0.1 --port 4173 >../frontend.log 2>&1) &
          for i in {1..60}; do curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat backend.log frontend.log
          exit 1
      - name: Run pinned Chromium suite
        run: cd frontend && npx playwright test e2e/staging.spec.cjs --browser=chromium --workers=1 --reporter=line
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanasu-browser-${{ github.run_id }}
          path: |
            backend.log
            frontend.log
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy_staging:
    name: Deploy exact tested commit to Render staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/m9-v1-research-platform'
    needs: [test, frontend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse stale workflow run
        shell: bash
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin refs/heads/m9-v1-research-platform | awk '{print $1}')"
          test "$remote" = "$GITHUB_SHA"
      - name: Deploy exact tested SHA
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: python scripts/render_deploy.py --sha "$GITHUB_SHA"
