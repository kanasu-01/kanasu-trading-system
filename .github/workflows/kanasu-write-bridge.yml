name: Kanasu Write Bridge

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Existing development branch to modify"
        required: true
        type: string

      expected_head:
        description: "Exact 40-character HEAD SHA expected before applying changes"
        required: true
        type: string

      commit_message:
        description: "Commit message"
        required: true
        type: string

      payload_b64:
        description: "Base64-encoded Kanasu change package"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: kanasu-write-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  apply:
    name: Validate, test, commit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}
      PAYLOAD_B64: ${{ inputs.payload_b64 }}

    steps:
      - name: Validate request
        shell: bash
        run: |
          set -euo pipefail

          if ! git check-ref-format --branch "$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Invalid target branch: $TARGET_BRANCH"
            exit 1
          fi

          case "$TARGET_BRANCH" in
            main|master)
              echo "The write bridge may not modify the stable branch directly."
              exit 1
              ;;
          esac

          if [[ ! "$EXPECTED_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "expected_head must be an exact 40-character Git SHA."
            exit 1
          fi

          if [[ -z "$COMMIT_MESSAGE" ]]; then
            echo "commit_message is required."
            exit 1
          fi

          if (( ${#COMMIT_MESSAGE} > 120 )); then
            echo "commit_message must be 120 characters or fewer."
            exit 1
          fi

      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Verify exact branch HEAD
        shell: bash
        run: |
          set -euo pipefail

          ACTUAL_HEAD="$(git rev-parse HEAD)"

          echo "Target branch: $TARGET_BRANCH"
          echo "Expected HEAD: $EXPECTED_HEAD"
          echo "Actual HEAD:   $ACTUAL_HEAD"

          if [[ "${ACTUAL_HEAD,,}" != "${EXPECTED_HEAD,,}" ]]; then
            echo "Branch HEAD changed. Refusing to apply stale change package."
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Checkout is unexpectedly dirty."
            git status --short
            exit 1
          fi

      - name: Apply validated change package
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path, PurePosixPath

          payload_text = os.environ["PAYLOAD_B64"]

          try:
              raw = base64.b64decode(
                  payload_text,
                  validate=True,
              )
          except Exception as exc:
              raise SystemExit(
                  f"Invalid payload base64: {exc}"
              )

          if len(raw) > 500_000:
              raise SystemExit(
                  "Decoded payload exceeds 500 KB safety limit"
              )

          try:
              payload = json.loads(raw.decode("utf-8"))
          except Exception as exc:
              raise SystemExit(
                  f"Invalid UTF-8 JSON payload: {exc}"
              )

          if not isinstance(payload, dict):
              raise SystemExit(
                  "Payload root must be a JSON object"
              )

          if set(payload) != {"files"}:
              raise SystemExit(
                  "Payload must contain exactly one key: files"
              )

          files = payload["files"]

          if (
              not isinstance(files, list)
              or not files
              or len(files) > 20
          ):
              raise SystemExit(
                  "files must contain between 1 and 20 entries"
              )

          root = Path.cwd().resolve()
          seen = set()

          for index, item in enumerate(files, start=1):
              if not isinstance(item, dict):
                  raise SystemExit(
                      f"files[{index}] must be an object"
                  )

              action = item.get("action", "write")
              path_text = item.get("path")

              if (
                  not isinstance(path_text, str)
                  or not path_text
              ):
                  raise SystemExit(
                      f"files[{index}].path is required"
                  )

              if "\\" in path_text:
                  raise SystemExit(
                      f"Backslashes are not allowed: {path_text}"
                  )

              pure = PurePosixPath(path_text)

              if (
                  pure.is_absolute()
                  or ".." in pure.parts
                  or path_text.startswith(".git/")
                  or path_text == ".git"
              ):
                  raise SystemExit(
                      f"Unsafe repository path: {path_text}"
                  )

              if path_text.startswith(
                  ".github/workflows/"
              ):
                  raise SystemExit(
                      "The bridge may not modify workflow files"
                  )

              if path_text in seen:
                  raise SystemExit(
                      f"Duplicate path in payload: {path_text}"
                  )

              seen.add(path_text)

              target = root.joinpath(*pure.parts)

              current = target
              while current != root:
                  if (
                      current.exists()
                      and current.is_symlink()
                  ):
                      raise SystemExit(
                          f"Symlink path is not allowed: {path_text}"
                      )
                  current = current.parent

              if action == "write":
                  content_b64 = item.get("content_b64")

                  if not isinstance(content_b64, str):
                      raise SystemExit(
                          f"content_b64 required for {path_text}"
                      )

                  try:
                      data = base64.b64decode(
                          content_b64,
                          validate=True,
                      )
                  except Exception as exc:
                      raise SystemExit(
                          f"Invalid content for {path_text}: {exc}"
                      )

                  try:
                      data.decode("utf-8")
                  except UnicodeDecodeError:
                      raise SystemExit(
                          f"Only UTF-8 text files are supported: {path_text}"
                      )

                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True,
                  )
                  target.write_bytes(data)

              elif action == "delete":
                  if "content_b64" in item:
                      raise SystemExit(
                          f"Delete entry may not contain content: {path_text}"
                      )

                  if not target.exists():
                      raise SystemExit(
                          f"Cannot delete missing file: {path_text}"
                      )

                  if not target.is_file():
                      raise SystemExit(
                          f"Only files may be deleted: {path_text}"
                      )

                  target.unlink()

              else:
                  raise SystemExit(
                      f"Unsupported action for {path_text}: {action}"
                  )

          print(
              f"Applied {len(files)} validated file operation(s)."
          )
          PY

      - name: Show proposed changes
        shell: bash
        run: |
          set -euo pipefail

          echo "CHANGED FILES:"
          git status --short

          echo
          echo "DIFF STAT:"
          git diff --stat

          echo
          echo "DIFF CHECK:"
          git diff --check

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run full Kanasu test suite
        shell: bash
        run: |
          set -euo pipefail

          pytest -q

      - name: Stage and validate exact commit
        shell: bash
        run: |
          set -euo pipefail

          git add -A

          if git diff --cached --quiet; then
            echo "Change package produced no repository changes."
            exit 1
          fi

          echo "STAGED FILES:"
          git diff --cached --name-status

          echo
          echo "STAGED DIFF CHECK:"
          git diff --cached --check

      - name: Commit and push
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "$COMMIT_MESSAGE"

          COMMIT_SHA="$(git rev-parse HEAD)"

          git push origin "HEAD:$TARGET_BRANCH"

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Write run summary
        shell: bash
        run: |
          {
            echo "## Kanasu Write Bridge"
            echo
            echo "**Branch:** \`$TARGET_BRANCH\`"
            echo
            echo "**Previous HEAD:** \`$EXPECTED_HEAD\`"
            echo
            echo "**New commit:** \`${{ steps.commit.outputs.commit_sha }}\`"
            echo
            echo "**Commit message:** $COMMIT_MESSAGE"
            echo
            echo "Full pytest validation passed before push."
          } >> "$GITHUB_STEP_SUMMARY"
