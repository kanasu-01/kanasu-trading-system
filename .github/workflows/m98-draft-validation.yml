          GIT_INDEX_FILE=/tmp/m98-cand012.index git -C "$GITHUB_WORKSPACE" rm -q --cached --ignore-unmatch .github/workflows/m98-draft-validation.yml
          ACTUAL_TREE="$(GIT_INDEX_FILE=/tmp/m98-cand012.index git -C "$GITHUB_WORKSPACE" write-tree)"
          echo "M98_CAND012_TREE=$ACTUAL_TREE"
          test "$ACTUAL_TREE" = "5ffb349ad0a6baf980744c3018a1411f8cf2d19b"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run coherent Paper lifecycle and display-lineage controls
        run: |
          pytest tests/api/test_m98_research_workspace_application.py \
            -k "paper_history_reconciles_terminalization_between_reads or paper_history_projects_durable_terminal_display_snapshot or paper_history_persistent_mixed_lifecycle_fails_closed or selected_terminal_snapshot_survives_unrelated_active_runtime or interrupted_session_never_fabricates_display_snapshot" -q
