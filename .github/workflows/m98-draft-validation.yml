name: M9.8 CAND011 PRE-FREEZE Validation

on:
  push:
    branches:
      - m98-draft-validation-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report current M98-CAND-011 lean draft tree
        run: |
          INDEX_PATH="$(git -C "$GITHUB_WORKSPACE" rev-parse --git-path index)"
          case "$INDEX_PATH" in
            /*) ;;
            *) INDEX_PATH="$GITHUB_WORKSPACE/$INDEX_PATH" ;;
          esac
          cp "$INDEX_PATH" /tmp/m98-cand010.index
          GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" read-tree HEAD
          GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" rm -q --cached --ignore-unmatch .github/workflows/m98-draft-validation.yml
          ACTUAL_TREE="$(GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" write-tree)"
          echo "M98_CAND011_FROZEN_TREE=$ACTUAL_TREE"
          test "$ACTUAL_TREE" = "0c11564981291e601fedcda42a58ab736dfdfd40"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: pytest

  cand010-adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run CAND011 defect-family adversarial regressions
        run: |
          pytest             tests/api/test_m98_research_workspace_application.py             tests/research/test_m96_candidate_bound_wfa.py             tests/research/test_m98_workspace_store_extensions.py             tests/research/test_successor_historical_retrieval.py             tests/market_data/test_instrument_registry_loader.py             -k cand010

  cand010-preservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run CAND011 lifecycle and authority preservation controls
        run: |
          pytest             tests/api/test_m98_research_workspace_application.py             tests/research/test_m98_workspace_store_extensions.py             tests/api/test_paper_trading_application.py             tests/research/test_m97_qualified_paper_campaign.py             -k "start_does_not_implicitly_retry_failed_trial or send_to_paper_preserves_partial_results_when_one_candidate_fails or concurrent_send_to_paper_reuses_one_matching_campaign or session_registration_binds_exact_latest_observed_generation or expected_session_stop_rejects_different_active_session or concurrent_start_allows_only_one_composition or sqlite_campaign_session_survives_reopen_and_restart_recovery or new_session_after_interruption_rechecks_current_authority"

  preparation-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record SOP-G-003-V014 requirement-70 preparation diagnostic
        run: |
          cat > M98_CAND011_PREPARATION_DIAGNOSTIC.md <<'EOF'
          # M98-CAND-011 pre-freeze preparation diagnostic

          Trigger: M98-CAND-008 and M98-CAND-009 are two accepted failed canonical candidates for the same M9.8 controlled objective. M98-CAND-011 must not freeze until this diagnostic and the changed preparation method are exercised.

          Known escape pattern: pre-freeze qualification proved many direct behaviors but did not fully prove causal continuity of caller-observed authority through later re-resolution and durable writes, same-policy decision-generation coherence, fresh PROVIDER_BACKED coverage independently of warm cache, and provider metadata unit/temporal truth.

          CAND009 material findings: F01 unseen WFA substitution in Send-to-Paper; F02 stale Start-WFA re-resolution/persistence risk; F03 warm cache masking incomplete fresh provider coverage; F04 mixed same-policy qualification/WFA generations; F05 starter-instrument metadata contradicted retained provider rows and lacked defensible temporal application.

          Defect families:
          - Authority substitution / TOCTOU: F01, F02.
          - Snapshot coherence under same-policy supersession: F04.
          - Fresh provider evidence truth independent of cache: F03.
          - Provider metadata unit/temporal truth: F05.

          Preparation-method changes before any CAND011 freeze:
          1. Propagate exact observed authority to the durable writer; re-resolution may validate but never substitute.
          2. Add deterministic stale-policy and same-policy supersession regressions.
          3. Read Study qualification plus dependent WFA authority in one SQLite snapshot and test a deterministic concurrent mutation.
          4. Require each PROVIDER_BACKED fresh binding segment to be complete before cache union and test warm-cache plus multi-binding partial responses.
          5. Verify all five instrument tick sizes against retained AngelOne master rows with paise-to-rupee normalization and bind instrument metadata to the retained observation time rather than projecting it backward.
          6. Run focused defect-family gates, complete backend regression, frontend tests/build/lint, provider-master validation, assembled browser smoke, diff/reconstruction checks, and exact lean-tree freeze verification.
          7. Keep CAND011 non-canonical until every mandatory gate passes; any material unresolved failure keeps DRAFT/BLOCKED.
          EOF
          sha256sum M98_CAND011_PREPARATION_DIAGNOSTIC.md
      - uses: actions/upload-artifact@v4
        with:
          name: m98-cand010-preparation-diagnostic
          path: M98_CAND011_PREPARATION_DIAGNOSTIC.md
          if-no-files-found: error
          retention-days: 90

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Report current M98-CAND-011 lean draft tree
        run: |
          INDEX_PATH="$(git -C "$GITHUB_WORKSPACE" rev-parse --git-path index)"
          case "$INDEX_PATH" in
            /*) ;;
            *) INDEX_PATH="$GITHUB_WORKSPACE/$INDEX_PATH" ;;
          esac
          cp "$INDEX_PATH" /tmp/m98-cand010.index
          GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" read-tree HEAD
          GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" rm -q --cached --ignore-unmatch .github/workflows/m98-draft-validation.yml
          ACTUAL_TREE="$(GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" write-tree)"
          echo "M98_CAND011_FROZEN_TREE=$ACTUAL_TREE"
          test "$ACTUAL_TREE" = "0c11564981291e601fedcda42a58ab736dfdfd40"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint


  provider-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report current M98-CAND-011 lean draft tree
        run: |
          INDEX_PATH="$(git -C "$GITHUB_WORKSPACE" rev-parse --git-path index)"
          case "$INDEX_PATH" in
            /*) ;;
            *) INDEX_PATH="$GITHUB_WORKSPACE/$INDEX_PATH" ;;
          esac
          cp "$INDEX_PATH" /tmp/m98-cand010.index
          GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" read-tree HEAD
          GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" rm -q --cached --ignore-unmatch .github/workflows/m98-draft-validation.yml
          ACTUAL_TREE="$(GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" write-tree)"
          echo "M98_CAND011_FROZEN_TREE=$ACTUAL_TREE"
          test "$ACTUAL_TREE" = "0c11564981291e601fedcda42a58ab736dfdfd40"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify current AngelOne instrument master
        run: |
          python - <<'PY'
          import hashlib
          import json
          from decimal import Decimal
          from pathlib import Path
          import urllib.request

          url = "https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Kanasu-M9.8-validation/1.0"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              raw = response.read()

          digest = hashlib.sha256(raw).hexdigest()
          rows = json.loads(raw)
          if not isinstance(rows, list) or not rows:
              raise SystemExit("AngelOne instrument master is not a non-empty JSON array")

          snapshot = json.loads(
              Path("config/provider_snapshots/angelone_nse_eq_starter_2026-11-08.json")
              .read_text(encoding="utf-8")
          )
          registry = json.loads(
              Path("config/instrument_registry.json").read_text(encoding="utf-8")
          )
          expected_rows = snapshot["selected_rows"]
          selected = {}
          for symbol, expected_row in expected_rows.items():
              token = str(expected_row["token"])
              matches = [
                  row
                  for row in rows
                  if row.get("exch_seg") == "NSE"
                  and row.get("symbol") == symbol
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{symbol}: expected exactly one NSE row, found {len(matches)}"
                  )
              row = matches[0]
              if str(row.get("token")) != token:
                  raise SystemExit(
                      f"{symbol}: expected token {token}, got {row.get('token')}"
                  )
              critical_fields = (
                  "token",
                  "symbol",
                  "name",
                  "exch_seg",
                  "lotsize",
                  "tick_size",
              )
              changed_critical = {
                  field: {
                      "retained": expected_row.get(field),
                      "current": row.get(field),
                  }
                  for field in critical_fields
                  if row.get(field) != expected_row.get(field)
              }
              if changed_critical:
                  raise SystemExit(
                      f"{symbol}: current authority fields changed: "
                      f"{json.dumps(changed_critical, sort_keys=True)}"
                  )
              if row != expected_row:
                  changed_non_authority = {
                      field: {
                          "retained": expected_row.get(field),
                          "current": row.get(field),
                      }
                      for field in sorted(
                          set(row) | set(expected_row)
                      )
                      if (
                          field not in critical_fields
                          and row.get(field) != expected_row.get(field)
                      )
                  }
                  print(
                      "ANGELONE_NON_AUTHORITY_ROW_DRIFT="
                      + symbol
                      + ":"
                      + json.dumps(
                          changed_non_authority,
                          sort_keys=True,
                          separators=(",", ":"),
                      )
                  )
              selected[symbol] = row

          if snapshot["full_master_sha256"] != "92c425bd56f4edd48fe3f8aa859be39cbf472d8a64e821cc4322029568e81437":
              raise SystemExit("retained bootstrap master SHA-256 changed unexpectedly")
          if snapshot["observed_at"] != "2026-11-08T12:31:00.275890+00:00":
              raise SystemExit("retained bootstrap observation time changed unexpectedly")

          registry_by_symbol = {
              binding["provider_symbol"]: binding
              for binding in registry["provider_bindings"]
              if binding["provider"] == "angelone"
          }
          registry_instruments = {
              instrument["symbol"]: instrument
              for instrument in registry["instruments"]
          }
          for provider_symbol, expected_row in expected_rows.items():
              runtime_symbol = expected_row["name"]
              binding = registry_by_symbol.get(runtime_symbol)
              instrument = registry_instruments.get(runtime_symbol)
              if binding is None:
                  raise SystemExit(f"{runtime_symbol}: registry binding missing")
              if instrument is None:
                  raise SystemExit(f"{runtime_symbol}: registry instrument missing")
              expected_tick = Decimal(str(expected_row["tick_size"])) / Decimal("100")
              actual_tick = Decimal(str(instrument["tick_size"]))
              if actual_tick != expected_tick:
                  raise SystemExit(
                      f"{runtime_symbol}: registry tick {actual_tick} disagrees "
                      f"with provider-normalized tick {expected_tick}"
                  )
              if instrument["effective_from"] != snapshot["observed_at"]:
                  raise SystemExit(
                      f"{runtime_symbol}: instrument metadata is not snapshot-bound"
                  )
              if instrument["effective_to"] is not None:
                  raise SystemExit(
                      f"{runtime_symbol}: bootstrap instrument metadata must remain open until superseded"
                  )
              if str(binding["provider_instrument_id"]) != str(expected_row["token"]):
                  raise SystemExit(f"{runtime_symbol}: registry token disagrees with snapshot")
              if binding["provider_exchange"] != expected_row["exch_seg"]:
                  raise SystemExit(f"{runtime_symbol}: registry exchange disagrees with snapshot")
              if binding["effective_from"] != snapshot["observed_at"]:
                  raise SystemExit(f"{runtime_symbol}: registry effective_from is not snapshot-bound")
              if binding["effective_to"] is not None:
                  raise SystemExit(f"{runtime_symbol}: bootstrap current binding must remain open until superseded")

          evidence = Path("provider-master-evidence")
          evidence.mkdir()
          (evidence / "OpenAPIScripMaster.json").write_bytes(raw)
          (evidence / "manifest.json").write_text(
              json.dumps(
                  {
                      "source_url": url,
                      "sha256": digest,
                      "byte_count": len(raw),
                      "record_count": len(rows),
                      "selected_rows": selected,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          print(f"ANGELONE_MASTER_SHA256={digest}")
          print(f"ANGELONE_MASTER_BYTES={len(raw)}")
          print(f"ANGELONE_MASTER_RECORDS={len(rows)}")
          for symbol in sorted(selected):
              print(
                  f"ANGELONE_BINDING={symbol}:{selected[symbol].get('token')}:"
                  f"{selected[symbol].get('exch_seg')}"
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m98-angelone-provider-master
          path: provider-master-evidence
          if-no-files-found: error
          retention-days: 90

  mechanical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report current M98-CAND-011 lean draft tree
        run: |
          INDEX_PATH="$(git -C "$GITHUB_WORKSPACE" rev-parse --git-path index)"
          case "$INDEX_PATH" in
            /*) ;;
            *) INDEX_PATH="$GITHUB_WORKSPACE/$INDEX_PATH" ;;
          esac
          cp "$INDEX_PATH" /tmp/m98-cand010.index
          GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" read-tree HEAD
          GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" rm -q --cached --ignore-unmatch .github/workflows/m98-draft-validation.yml
          ACTUAL_TREE="$(GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" write-tree)"
          echo "M98_CAND011_FROZEN_TREE=$ACTUAL_TREE"
          test "$ACTUAL_TREE" = "0c11564981291e601fedcda42a58ab736dfdfd40"
      - name: Verify candidate diff mechanics
        run: |
          git diff --check 035ad39c73e69e647dbf492c999424f78c9c87bc HEAD -- . ':(exclude).github/workflows/m98-draft-validation.yml'
          python - <<'PY'
          import subprocess

          baseline = "035ad39c73e69e647dbf492c999424f78c9c87bc"
          excluded = ".github/workflows/m98-draft-validation.yml"
          expected_count = 47

          output = subprocess.check_output(
              ["git", "diff", "--name-status", baseline, "HEAD", "--", ".", f":(exclude){excluded}"],
              text=True,
          )
          rows = [line for line in output.splitlines() if line.strip()]
          if len(rows) != expected_count:
              raise SystemExit(
                  f"expected {expected_count} candidate paths, found {len(rows)}"
              )
          if any(line.startswith("D\t") for line in rows):
              raise SystemExit("candidate contains an unexpected deletion")
          print(f"CANDIDATE_PATHS={len(rows)}")
          print(output)
          PY

  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Report current M98-CAND-011 lean draft tree
        run: |
          INDEX_PATH="$(git -C "$GITHUB_WORKSPACE" rev-parse --git-path index)"
          case "$INDEX_PATH" in
            /*) ;;
            *) INDEX_PATH="$GITHUB_WORKSPACE/$INDEX_PATH" ;;
          esac
          cp "$INDEX_PATH" /tmp/m98-cand010.index
          GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" read-tree HEAD
          GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" rm -q --cached --ignore-unmatch .github/workflows/m98-draft-validation.yml
          ACTUAL_TREE="$(GIT_INDEX_FILE=/tmp/m98-cand010.index git -C "$GITHUB_WORKSPACE" write-tree)"
          echo "M98_CAND011_FROZEN_TREE=$ACTUAL_TREE"
          test "$ACTUAL_TREE" = "0c11564981291e601fedcda42a58ab736dfdfd40"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Run assembled browser navigation smoke
        run: |
          command -v google-chrome
          google-chrome --version
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/m98-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          for route in / /backtest /wfa /paper /paper/standalone; do
            google-chrome \
              --headless \
              --no-sandbox \
              --disable-gpu \
              --virtual-time-budget=3000 \
              --dump-dom \
              "http://127.0.0.1:4173$route" \
              > /tmp/m98-dom.html
            grep -q ">Home<" /tmp/m98-dom.html
            grep -q ">Backtest<" /tmp/m98-dom.html
            grep -q ">WFA<" /tmp/m98-dom.html
            grep -q ">Paper Trading<" /tmp/m98-dom.html
          done

  candidate-package:
    if: false
    needs:
      - backend
      - cand010-adversarial
      - cand010-preservation
      - preparation-diagnostic
      - frontend
      - provider-master
      - mechanical
      - browser-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: m98-cand010-preparation-diagnostic
          path: /tmp/cand010-diagnostic
      - name: Build exact M98-CAND-011 review package
        env:
          BASELINE_COMMIT: 035ad39c73e69e647dbf492c999424f78c9c87bc
          BASELINE_TREE: 7304ad7d651e6768b7b9e0715527c9cbe4292543
          CANDIDATE_ID: M98-CAND-011
          EXPECTED_CANDIDATE_TREE: 0c11564981291e601fedcda42a58ab736dfdfd40
          VALIDATION_FREEZE_COMMIT: 52d0e2db297e7a572813048b2a2a6ff105378890
          VALIDATION_FREEZE_TREE: b027b46392292c09a438d3ef696964a7c1e4fa03
          VALIDATION_WORKFLOW: .github/workflows/m98-draft-validation.yml
          PREFREEZE_VALIDATION_RUN_ID: "42563963073"
          NORMAL_TEST_RUN_ID: "42563962973"
          PREPARATION_DIAGNOSTIC_SHA256: e0b0cf8f2daa852f4dd918f7bf22dab772aeab587108788864c13de2c49250fb
          RETAINED_PROVIDER_MASTER_SHA256: 92c425bd56f4edd48fe3f8aa859be39cbf472d8a64e821cc4322029568e81437
          RETAINED_PROVIDER_MASTER_BYTES: "37983303"
          RETAINED_PROVIDER_MASTER_RECORDS: "161793"
          PROVIDER_OBSERVED_AT: "2026-11-08T12:31:00.275890+00:00"
          CURRENT_PROVIDER_MASTER_SHA256: 5520e5b482de7e78780e55dc302739990e1f98f04b2b6ab180cbb1c12131da92
          CURRENT_PROVIDER_MASTER_BYTES: "38126571"
          CURRENT_PROVIDER_MASTER_RECORDS: "162417"
        run: |
          set -euo pipefail
          OUT=/tmp/m98-cand010
          rm -rf "$OUT"
          mkdir -p "$OUT/add_payloads" "$OUT/modified_original" "$OUT/modified_proposed"
          mkdir -p "$OUT/controlled_docs/original" "$OUT/controlled_docs/proposed"

          INDEX_PATH="$(git rev-parse --git-path index)"
          case "$INDEX_PATH" in
            /*) ;;
            *) INDEX_PATH="$GITHUB_WORKSPACE/$INDEX_PATH" ;;
          esac
          cp "$INDEX_PATH" /tmp/candidate.index
          GIT_INDEX_FILE=/tmp/candidate.index git read-tree HEAD
          GIT_INDEX_FILE=/tmp/candidate.index git rm -q --cached --ignore-unmatch "$VALIDATION_WORKFLOW"
          LEAN_TREE="$(GIT_INDEX_FILE=/tmp/candidate.index git write-tree)"
          test "$LEAN_TREE" = "$EXPECTED_CANDIDATE_TREE"

          git diff --check "$BASELINE_COMMIT" HEAD -- . ":(exclude)$VALIDATION_WORKFLOW"
          git diff --binary --full-index "$BASELINE_COMMIT" HEAD -- . ":(exclude)$VALIDATION_WORKFLOW" > "$OUT/M98_CAND011.patch"
          git diff --name-status "$BASELINE_COMMIT" HEAD -- . ":(exclude)$VALIDATION_WORKFLOW" > "$OUT/candidate_name_status.tsv"

          cp /tmp/cand010-diagnostic/M98_CAND011_PREPARATION_DIAGNOSTIC.md "$OUT/"
          echo "$PREPARATION_DIAGNOSTIC_SHA256  $OUT/M98_CAND011_PREPARATION_DIAGNOSTIC.md" | sha256sum -c -

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          out = Path("/tmp/m98-cand010")
          baseline = os.environ["BASELINE_COMMIT"]
          baseline_tree = os.environ["BASELINE_TREE"]
          candidate_id = os.environ["CANDIDATE_ID"]
          expected_tree = os.environ["EXPECTED_CANDIDATE_TREE"]
          freeze_commit = os.environ["VALIDATION_FREEZE_COMMIT"]
          freeze_tree = os.environ["VALIDATION_FREEZE_TREE"]
          workflow = os.environ["VALIDATION_WORKFLOW"]
          diagnostic_sha = os.environ["PREPARATION_DIAGNOSTIC_SHA256"]

          def run(*args):
              return subprocess.check_output(args, text=True).strip()

          lines = run(
              "git", "diff", "--name-status", baseline, "HEAD",
              "--", ".", f":(exclude){workflow}",
          ).splitlines()
          rows = []
          for line in lines:
              if not line:
                  continue
              status, path = line.split("\t", 1)
              if status not in ("A", "M"):
                  raise SystemExit("unsupported status: " + line)
              content = (root / path).read_bytes()
              mode = run("git", "ls-tree", "HEAD", "--", path).split()[0]
              succ = run("git", "rev-parse", "HEAD:" + path)
              row = {
                  "path": path,
                  "status": "added" if status == "A" else "modified",
                  "mode": mode,
                  "successor_blob_sha": succ,
                  "successor_sha256": hashlib.sha256(content).hexdigest(),
                  "bytes": len(content),
              }
              if status == "M":
                  pred = run("git", "rev-parse", baseline + ":" + path)
                  old = subprocess.check_output(["git", "show", baseline + ":" + path])
                  row["predecessor_blob_sha"] = pred
                  row["predecessor_sha256"] = hashlib.sha256(old).hexdigest()
                  po = out / "modified_original" / path
                  po.parent.mkdir(parents=True, exist_ok=True)
                  po.write_bytes(old)
                  pp = out / "modified_proposed" / path
                  pp.parent.mkdir(parents=True, exist_ok=True)
                  pp.write_bytes(content)
              else:
                  try:
                      subprocess.check_output(
                          ["git", "cat-file", "-e", baseline + ":" + path],
                          stderr=subprocess.DEVNULL,
                      )
                  except subprocess.CalledProcessError:
                      pass
                  else:
                      raise SystemExit("ADD exists at baseline: " + path)
                  p = out / "add_payloads" / path
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_bytes(content)
              rows.append(row)

          if (
              len(rows) != 47
