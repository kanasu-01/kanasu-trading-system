name: M9.8 DRAFT Validation

on:
  push:
    branches:
      - m98-draft-validation-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint


  provider-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify current AngelOne instrument master
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request

          url = "https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Kanasu-M9.8-validation/1.0"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              raw = response.read()

          digest = hashlib.sha256(raw).hexdigest()
          rows = json.loads(raw)
          if not isinstance(rows, list) or not rows:
              raise SystemExit("AngelOne instrument master is not a non-empty JSON array")

          expected = {
              "HDFCBANK-EQ": "1333",
              "INFY-EQ": "1594",
              "RELIANCE-EQ": "2885",
              "SBIN-EQ": "3045",
              "TCS-EQ": "11536",
          }
          selected = {}
          for symbol, token in expected.items():
              matches = [
                  row
                  for row in rows
                  if row.get("exch_seg") == "NSE"
                  and row.get("symbol") == symbol
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{symbol}: expected exactly one NSE row, found {len(matches)}"
                  )
              row = matches[0]
              if str(row.get("token")) != token:
                  raise SystemExit(
                      f"{symbol}: expected token {token}, got {row.get('token')}"
                  )
              selected[symbol] = row

          evidence = Path("provider-master-evidence")
          evidence.mkdir()
          (evidence / "OpenAPIScripMaster.json").write_bytes(raw)
          (evidence / "manifest.json").write_text(
              json.dumps(
                  {
                      "source_url": url,
                      "sha256": digest,
                      "byte_count": len(raw),
                      "record_count": len(rows),
                      "selected_rows": selected,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          print(f"ANGELONE_MASTER_SHA256={digest}")
          print(f"ANGELONE_MASTER_BYTES={len(raw)}")
          print(f"ANGELONE_MASTER_RECORDS={len(rows)}")
          for symbol in sorted(selected):
              print(
                  f"ANGELONE_BINDING={symbol}:{selected[symbol].get('token')}:"
                  f"{selected[symbol].get('exch_seg')}"
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m98-angelone-provider-master
          path: provider-master-evidence
          if-no-files-found: error
          retention-days: 90
