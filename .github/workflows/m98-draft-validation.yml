name: M9.8 CAND012 RED Reconstruction

on:
  push:
    branches:
      - m98-draft-validation-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Prove Paper terminal-coherence tests are RED
        run: |
          set +e
          pytest tests/api/test_m98_research_workspace_application.py \
            -k cand012_red -q > /tmp/cand012-backend-red.txt 2>&1
          EXIT=$?
          set -e
          cat /tmp/cand012-backend-red.txt
          test "$EXIT" -ne 0
          grep -q "test_cand012_red_paper_history_reconciles_terminalization_between_reads" /tmp/cand012-backend-red.txt
          grep -q "test_cand012_red_paper_history_projects_durable_terminal_display_snapshot" /tmp/cand012-backend-red.txt
          grep -Eq "[1-9][0-9]* failed" /tmp/cand012-backend-red.txt

  frontend-red:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Prove terminal-metrics tests are RED
        run: |
          set +e
          npm test -- --run tests/ResearchPaperPage.test.tsx \
            -t "CAND012 RED" > /tmp/cand012-frontend-red.txt 2>&1
          EXIT=$?
          set -e
          cat /tmp/cand012-frontend-red.txt
          test "$EXIT" -ne 0
          grep -q "keeps final qualified Paper metrics visible" /tmp/cand012-frontend-red.txt
          grep -q "selected terminal metrics survive an unrelated active runtime" /tmp/cand012-frontend-red.txt
          grep -Eq "[1-9][0-9]* failed" /tmp/cand012-frontend-red.txt
