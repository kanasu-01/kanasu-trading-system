name: M9.8 CAND012 GREEN Reconstruction

on:
  push:
    branches:
      - m98-draft-validation-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run Paper terminal-coherence GREEN controls
        run: |
          pytest tests/api/test_m98_research_workspace_application.py \
            -k "cand012_red or paper_projection_conflicts_if_authority_generation_changes" -q
          pytest tests/api/test_paper_trading_application.py \
            -k "stop_controls_runtime_waits_worker_and_retains_terminal_snapshot or expected_session_stop_rejects_different_active_session or worker_failure_is_retained_as_failed_terminal_snapshot or later_start_replaces_retained_terminal_session or natural_worker_completion_retains_stopped_snapshot" -q
          pytest tests/research/test_m97_qualified_paper_campaign.py \
            -k "sqlite_campaign_session_survives_reopen_and_restart_recovery or sqlite_terminal_evidence_is_append_only or sqlite_allows_only_one_active_session_and_freezes_start_time or terminal_callback_failure_is_never_reported_as_durable_success or history_remains_ordered_and_terminal_sessions_are_preserved" -q

  frontend-green:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Run Paper terminal-metrics GREEN controls
        run: |
          npm test -- --run tests/ResearchPaperPage.test.tsx
          npm run build
          npm run lint
