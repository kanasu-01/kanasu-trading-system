            tests/research/test_m98_workspace_store_extensions.py \
            tests/api/test_paper_trading_application.py \
            tests/research/test_m97_qualified_paper_campaign.py \
            -k "start_does_not_implicitly_retry_failed_trial or send_to_paper_preserves_partial_results_when_one_candidate_fails or concurrent_send_to_paper_reuses_one_matching_campaign or session_registration_binds_exact_latest_observed_generation or expected_session_stop_rejects_different_active_session or concurrent_start_allows_only_one_composition or sqlite_campaign_session_survives_reopen_and_restart_recovery or new_session_after_interruption_rechecks_current_authority or paper_history_reconciles_terminalization_between_reads or paper_history_projects_durable_terminal_display_snapshot or paper_history_persistent_mixed_lifecycle_fails_closed or selected_terminal_snapshot_survives_unrelated_active_runtime or interrupted_session_never_fabricates_display_snapshot" -q

  process-review-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact M98-CAND-012 lean draft tree
        run: |
          INDEX_PATH="$(git -C "$GITHUB_WORKSPACE" rev-parse --git-path index)"
          case "$INDEX_PATH" in
