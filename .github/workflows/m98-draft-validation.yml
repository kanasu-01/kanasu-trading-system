name: M9.8 DRAFT Validation

on:
  push:
    branches:
      - m98-draft-validation-20261108
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint


  provider-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify current AngelOne instrument master
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import urllib.request

          url = "https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Kanasu-M9.8-validation/1.0"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              raw = response.read()

          digest = hashlib.sha256(raw).hexdigest()
          rows = json.loads(raw)
          if not isinstance(rows, list) or not rows:
              raise SystemExit("AngelOne instrument master is not a non-empty JSON array")

          snapshot = json.loads(
              Path("config/provider_snapshots/angelone_nse_eq_starter_2026-11-08.json")
              .read_text(encoding="utf-8")
          )
          registry = json.loads(
              Path("config/instrument_registry.json").read_text(encoding="utf-8")
          )
          expected_rows = snapshot["selected_rows"]
          selected = {}
          for symbol, expected_row in expected_rows.items():
              token = str(expected_row["token"])
              matches = [
                  row
                  for row in rows
                  if row.get("exch_seg") == "NSE"
                  and row.get("symbol") == symbol
              ]
              if len(matches) != 1:
                  raise SystemExit(
                      f"{symbol}: expected exactly one NSE row, found {len(matches)}"
                  )
              row = matches[0]
              if str(row.get("token")) != token:
                  raise SystemExit(
                      f"{symbol}: expected token {token}, got {row.get('token')}"
                  )
              if row != expected_row:
                  raise SystemExit(
                      f"{symbol}: current row differs from retained bootstrap snapshot"
                  )
              selected[symbol] = row

          if snapshot["full_master_sha256"] != "92c425bd56f4edd48fe3f8aa859be39cbf472d8a64e821cc4322029568e81437":
              raise SystemExit("retained bootstrap master SHA-256 changed unexpectedly")
          if snapshot["observed_at"] != "2026-11-08T12:31:00.275890+00:00":
              raise SystemExit("retained bootstrap observation time changed unexpectedly")

          registry_by_symbol = {
              binding["provider_symbol"]: binding
              for binding in registry["provider_bindings"]
              if binding["provider"] == "angelone"
          }
          for provider_symbol, expected_row in expected_rows.items():
              runtime_symbol = expected_row["name"]
              binding = registry_by_symbol.get(runtime_symbol)
              if binding is None:
                  raise SystemExit(f"{runtime_symbol}: registry binding missing")
              if str(binding["provider_instrument_id"]) != str(expected_row["token"]):
                  raise SystemExit(f"{runtime_symbol}: registry token disagrees with snapshot")
              if binding["provider_exchange"] != expected_row["exch_seg"]:
                  raise SystemExit(f"{runtime_symbol}: registry exchange disagrees with snapshot")
              if binding["effective_from"] != snapshot["observed_at"]:
                  raise SystemExit(f"{runtime_symbol}: registry effective_from is not snapshot-bound")
              if binding["effective_to"] is not None:
                  raise SystemExit(f"{runtime_symbol}: bootstrap current binding must remain open until superseded")

          evidence = Path("provider-master-evidence")
          evidence.mkdir()
          (evidence / "OpenAPIScripMaster.json").write_bytes(raw)
          (evidence / "manifest.json").write_text(
              json.dumps(
                  {
                      "source_url": url,
                      "sha256": digest,
                      "byte_count": len(raw),
                      "record_count": len(rows),
                      "selected_rows": selected,
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )

          print(f"ANGELONE_MASTER_SHA256={digest}")
          print(f"ANGELONE_MASTER_BYTES={len(raw)}")
          print(f"ANGELONE_MASTER_RECORDS={len(rows)}")
          for symbol in sorted(selected):
              print(
                  f"ANGELONE_BINDING={symbol}:{selected[symbol].get('token')}:"
                  f"{selected[symbol].get('exch_seg')}"
              )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: m98-angelone-provider-master
          path: provider-master-evidence
          if-no-files-found: error
          retention-days: 90
